[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-assistant"
version = "0.1.0"
description = "Evidence-first personal career assistant"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "redis>=6.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
career = "career_assistant.cli:main"

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/career_assistant"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["career_assistant"]
