server {
    listen 8443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    set $csp_nonce $request_id;

    ssl_certificate /run/career-tls/tls.crt;
    ssl_certificate_key /run/career-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz { access_log off; return 204; }

    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        sub_filter '<script' '<script nonce="$csp_nonce"';
        sub_filter_once off;
        try_files $uri $uri/ /index.html;
    }
}
